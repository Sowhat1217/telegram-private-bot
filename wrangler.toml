name = "telegram-private-bot"
main = "worker.js"
compatibility_date = "2024-11-30"

# Git 连接部署时，本文件是 Worker 配置来源。
# keep_vars = true 可避免部署清掉后台里的 BOT_TOKEN / SUPERGROUP_ID 等变量。
keep_vars = true

# 若使用 Git 连接部署，必须在这里声明 KV 绑定，否则后台绑定会被覆盖。
# 把 id 换成你自己的 KV Namespace ID（Cloudflare → Storage & Databases → KV）。
# 不要提交别人的 namespace id。
# [[kv_namespaces]]
# binding = "TOPIC_MAP"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# 建议在 Cloudflare 后台 Worker Settings → Variables 中配置：
#   必需：BOT_TOKEN、SUPERGROUP_ID
#   Turnstile 验证（可选）：TURNSTILE_SITEKEY、TURNSTILE_SECRET
#   自定义域名时：PUBLIC_BASE_URL（如 https://chat.example.com）
#   额外屏蔽词（可选）：SPAM_KEYWORDS（逗号分隔）
#   静默拦截通知（可选）：SPAM_SILENCE_MODE=true
#   Webhook 加密（可选）：WEBHOOK_SECRET（配合 setWebhook 的 secret_token）
